<div class="login-container bg-primary">
  
  <div class="login-card">
    <div class="text-center">
      <h2>Welcome</h2>
      <p class="subtitle">Reserving System</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      
      <div class="form-group">
        <label>Email</label>
        <input type="email" formControlName="email" class="form-control" placeholder="professor@fundation.com"
               [class.error-highlight]="isHoveringSubmit && loginForm.get('email')?.invalid">
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" formControlName="password" class="form-control" placeholder="••••••••"
               [class.error-highlight]="isHoveringSubmit && loginForm.get('password')?.invalid">
      </div>

      @if (formErrorMessage) {
        <div class="global-error-message">
          ⚠ {{ formErrorMessage }}
        </div>
      }

      @if (backendErrorMessage) {
        <div class="global-error-message">
          {{ backendErrorMessage }}
        </div>
      }

      <div class="submit-wrapper w-100"
           (mouseenter)="isHoveringSubmit = true"
           (mouseleave)="isHoveringSubmit = false">
           
        <button type="submit" class="btn btn-primary w-100" [disabled]="loginForm.invalid">
            LOGIN
        </button>
      </div>

      <div class="auth-links">
        <p>
          <a routerLink="/auth/forgot-password" class="text-link">Forgot Password?</a>
        </p>
        <p class="mt-2">
          Don't have an account? <a routerLink="/auth/register" class="text-link-bold">Sign Up</a>
        </p>
      </div>
    </form>
    
  </div>
</div>
