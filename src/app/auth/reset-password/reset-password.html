<div class="login-container bg-primary">
  
    <div class="login-card">
      <div class="text-center">
        <h2>Reset Password</h2>
        <p class="subtitle">Enter your new secure password</p>
      </div>
  
      @if (successMessage) {
        <div class="text-center" style="margin: 30px 0;">
          <div style="background-color: #f0fdf4; color: #15803d; padding: 15px; border-radius: 8px; border: 1px solid #bbf7d0; margin-bottom: 20px;">
            ✓ {{ successMessage }}
          </div>
          <div class="auth-links">
            <p><a routerLink="/login" class="text-link-bold">Return to Login</a></p>
          </div>
        </div>
      } @else {
        
        <form [formGroup]="resetForm" (ngSubmit)="onSubmit()">
          
          <div class="form-group">
            <label>New Password</label>
            <input type="password" formControlName="newPassword" class="form-control" placeholder="Min 8 characters"
                   [class.error-highlight]="isHoveringSubmit && resetForm.get('newPassword')?.invalid">
          </div>
  
          <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" formControlName="confirmPassword" class="form-control" placeholder="Re-enter password"
                   [class.error-highlight]="isHoveringSubmit && (resetForm.get('confirmPassword')?.invalid || resetForm.hasError('passwordMismatch'))">
          </div>
  
          @if (formErrorMessage) {
            <div class="global-error-message">
              ⚠ {{ formErrorMessage }}
            </div>
          }
  
          @if (backendErrorMessage) {
            <div class="global-error-message">
              ⚠ {{ backendErrorMessage }}
            </div>
          }
  
          <div class="submit-wrapper w-100"
               (mouseenter)="isHoveringSubmit = true"
               (mouseleave)="isHoveringSubmit = false">
               
            <button type="submit" class="btn btn-primary w-100" [disabled]="resetForm.invalid || isLoading || !token">
              {{ isLoading ? 'RESETTING...' : 'RESET PASSWORD' }}
            </button>
          </div>
  
          <div class="auth-links">
            <p>
              Remembered your password? <a routerLink="/login" class="text-link-bold">Back to Login</a>
            </p>
          </div>
        </form>
      }
      
    </div>
  </div>
