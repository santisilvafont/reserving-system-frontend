<div class="login-container bg-primary">
    <div class="login-card">
      <div class="text-center">
        <h2>Create Account</h2>
        <p class="subtitle">Join the Reserving System</p>
      </div>
  
      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" formControlName="name" class="form-control" placeholder="Prof. John Doe"
                 [class.error-highlight]="isHoveringSubmit && registerForm.get('name')?.invalid">
        </div>
  
        <div class="form-group">
          <label>Email</label>
          <input type="email" formControlName="email" class="form-control" placeholder="professor@fundation.com"
                 [class.error-highlight]="isHoveringSubmit && registerForm.get('email')?.invalid">
        </div>
  
        <div class="form-group">
          <label>Password</label>
          <input type="password" formControlName="password" class="form-control" placeholder="••••••••"
                 [class.error-highlight]="isHoveringSubmit && registerForm.get('password')?.invalid">
        </div>
  
        @if (formErrorMessage) {
          <div class="global-error-message">
            ⚠ {{ formErrorMessage }}
          </div>
        }

        @if (backendErrorMessage) {
          <div class="global-error-message">
            {{ backendErrorMessage }}
          </div>
        }
  
        <div class="submit-wrapper w-100"
             (mouseenter)="isHoveringSubmit = true"
             (mouseleave)="isHoveringSubmit = false">
             
          <button type="submit" class="btn btn-primary w-100" [disabled]="registerForm.invalid">
              SIGN UP
          </button>
        </div>
  
        <div class="auth-links">
          <p class="mt-2">
            Already have an account? <a routerLink="/login" class="text-link-bold">Sign In</a>
          </p>
        </div>
  
      </form>
    </div>
  </div>
