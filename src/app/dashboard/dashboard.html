<div class="dashboard-layout">
  
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo-circle">RS</div>
        <h2 class="brand-name">Reserving System</h2>
      </div>
  
      <nav class="sidebar-nav">
        <a class="nav-item" routerLink="/dashboard/reservations" routerLinkActive="active">
          <span class="nav-text">Reservations</span>
        </a>
        <a class="nav-item" routerLink="/dashboard/halls" routerLinkActive="active">
          <span class="nav-text">Halls</span>
        </a>
        <a class="nav-item" routerLink="/dashboard/groups" routerLinkActive="active">
          <span class="nav-text">Groups</span>
        </a>
  
        @if (currentUser?.isAdmin) {
          <a class="nav-item" routerLink="/dashboard/users" routerLinkActive="active">
            <span class="nav-text">Users</span>
          </a>
        }
  
        <a class="nav-item" routerLink="/dashboard/profile" routerLinkActive="active">
          <span class="nav-text">My Profile</span>
        </a>
      </nav>
    </aside>
  
    <div class="main-wrapper">
      
      <header class="top-navbar">
        <div class="page-title">
          <h3>Overview</h3>
        </div>
        
        <div class="user-actions">
          <span class="user-greeting">Welcome, {{ userName }}</span>
          
          <button class="btn btn-outline-danger" (click)="onLogout()">
            Logout
          </button>
        </div>
      </header>
      <main class="content-area">       
        <router-outlet></router-outlet>       
      </main>
  
    </div>
  
  </div>
